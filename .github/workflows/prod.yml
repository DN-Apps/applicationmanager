name: Promote & Deploy PROD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PROD_URL: https://applicationmanager.ned-it.de

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QA-Digests holen
      - name: Download QA digests
        uses: actions/download-artifact@v4
        with:
          pattern: qa-digest-*
          merge-multiple: true

      - name: Read digests
        id: dig
        run: |
          echo "BE_DIGEST=$(cat backend.digest)" >> $GITHUB_ENV
          echo "FE_DIGEST=$(cat frontend.digest)" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend promote
      - name: Promote backend image to prod
        run: |
          SRC="ghcr.io/${{ github.repository_owner }}/appmanager-backend@${BE_DIGEST}"
          REPO="ghcr.io/${{ github.repository_owner }}/appmanager-backend"
          docker pull "$SRC"
          docker tag "$SRC" "$REPO:prod"
          docker tag "$SRC" "$REPO:${GITHUB_SHA::12}"
          docker push "$REPO:prod"
          docker push "$REPO:${GITHUB_SHA::12}"

      # Frontend promote
      - name: Promote frontend image to prod
        run: |
          SRC="ghcr.io/${{ github.repository_owner }}/appmanager-frontend@${FE_DIGEST}"
          REPO="ghcr.io/${{ github.repository_owner }}/appmanager-frontend"
          docker pull "$SRC"
          docker tag "$SRC" "$REPO:prod"
          docker tag "$SRC:${GITHUB_SHA::12}"
          docker push "$REPO:prod"
          docker push "$REPO:${GITHUB_SHA::12}"

  deploy-prod:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy with health check & auto-rollback
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PROD_URL: ${{ env.PROD_URL }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "REGISTRY_USER='$REGISTRY_USER' GHCR_TOKEN='$GHCR_TOKEN' PROD_URL='$PROD_URL' bash -s" <<'EOSH'
          set -e

          COMPOSE="/srv/docker/prod/applicationmanager/compose/docker-compose.prod.yml"

          BE=$(docker compose -f "$COMPOSE" ps -q prod-appmanager-backend || true)
          FE=$(docker compose -f "$COMPOSE" ps -q prod-appmanager-frontend || true)

          PREV_BE="" ; PREV_FE=""
          if [ -n "$BE" ]; then PREV_BE=$(docker inspect -f '{{.Image}}' "$BE" || true); fi
          if [ -n "$FE" ]; then PREV_FE=$(docker inspect -f '{{.Image}}' "$FE" || true); fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

          docker compose -f "$COMPOSE" pull
          docker compose -f "$COMPOSE" up -d

          echo "Waiting internal health..."
          fe_ok=false ; be_ok=false
          for i in {1..24}; do
            docker compose -f "$COMPOSE" exec -T prod-appmanager-frontend  sh -lc 'wget -qO- http://127.0.0.1/ >/dev/null' && fe_ok=true
            docker compose -f "$COMPOSE" exec -T prod-appmanager-backend   sh -lc 'wget -qO- http://127.0.0.1:5000/api/health' | grep -q '"status":"ok"' && be_ok=true
            $fe_ok && $be_ok && break
            sleep 5
          done

          if ! $fe_ok || ! $be_ok; then
            echo "Rollback!"
            [ -n "$PREV_BE" ] && docker tag "$PREV_BE" "$(docker compose -f "$COMPOSE" config | awk '/appmanager-backend/{print $2; exit}')"
            [ -n "$PREV_FE" ] && docker tag "$PREV_FE" "$(docker compose -f "$COMPOSE" config | awk '/appmanager-frontend/{print $2; exit}')"
            docker compose -f "$COMPOSE" up -d
            exit 1
          fi

          echo "External checks..."
          ok_fe=false ; ok_be=false
          for i in {1..24}; do
            curl -fsS "$PROD_URL/api/health" | grep -q '"status":"ok"' && ok_be=true
            curl -fsSIL "$PROD_URL/" | head -n1 | grep -q ' 200 ' && ok_fe=true
            $ok_fe && $ok_be && break
            sleep 5
          done

          if ! $ok_fe || ! $ok_be; then
            echo "Rollback ext!"
            [ -n "$PREV_BE" ] && docker tag "$PREV_BE" "$(docker compose -f "$COMPOSE" config | awk '/appmanager-backend/{print $2; exit}')"
            [ -n "$PREV_FE" ] && docker tag "$PREV_FE" "$(docker compose -f "$COMPOSE" config | awk '/appmanager-frontend/{print $2; exit}')"
            docker compose -f "$COMPOSE" up -d
            exit 1
          fi

          echo "Production healthy!"
          EOSH
